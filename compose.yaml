services:
  nitpick:
    container_name: nitpick-bot
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - TZ=Asia/Tokyo
      - PYTHONUNBUFFERED=1
    secrets:
      - token
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

secrets:
  token:
    file: ./token.txt
